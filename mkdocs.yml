site_name: Agent-Agnostic Observational Memory
site_description: Observational & Working Memory ingestion and Live Context Retrieval pipeline — an extension of the Coding Documentation
site_url: https://ritwik-ghosh09.github.io/Agent-Agnostic-Observational-Memory/
repo_url: https://github.com/ritwik-ghosh09/Agent-Agnostic-Observational-Memory
repo_name: ritwik-ghosh09/Agent-Agnostic-Observational-Memory

docs_dir: docs-content

theme:
  name: material
  palette:
    # Default: deep translucent dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Memory Retention: memory-pipeline/memory-retention.md
  - Live Context Retrieval: memory-pipeline/live-context-retrieval.md
  - Human-in-the-Loop: memory-pipeline/human-in-the-loop.md

extra:
  homepage: https://ritwik-ghosh09.github.io/Agent-Agnostic-Observational-Memory/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ritwik-ghosh09/Agent-Agnostic-Observational-Memory
    - icon: material/book-open-variant
      link: https://ritwik-ghosh09.github.io/Agent-Agnostic-Observational-Memory/
      name: Documentation site

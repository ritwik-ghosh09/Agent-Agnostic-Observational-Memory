name: Deploy Documentation

# Publishes the MkDocs site to BMW cc-pages via the gh-pages branch.
# NOTE: BMW GitHub Enterprise (cc-github.bmwgroup.net) does not support the
# github.com OIDC Pages actions (upload-pages-artifact / deploy-pages), so we
# publish with `mkdocs gh-deploy` to a gh-pages branch instead.

on:
  push:
    branches:
      - main
    paths:
      - 'docs-content/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Override with a repo/org Actions variable RUNNER_LABEL if a specific
    # self-hosted runner pool is required on cc-github.bmwgroup.net.
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-minify-plugin

      - name: Build (strict) & deploy to gh-pages
        run: |
          mkdocs build --strict
          mkdocs gh-deploy --force --no-history


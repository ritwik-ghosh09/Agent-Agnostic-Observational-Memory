name: Deploy Documentation

# Publishes the MkDocs site to GitHub Pages on bmw.ghe.com (GitHub Enterprise
# Cloud) via the gh-pages branch. `mkdocs gh-deploy` needs only checkout +
# python, so it works on the GHEC GitHub-hosted runners without the OIDC Pages
# actions. After the first run, enable Pages in repo Settings → Pages with the
# gh-pages branch as the source.

on:
  push:
    branches:
      - main
    paths:
      - 'docs-content/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # GHEC provides GitHub-hosted runners. Override with an Actions variable
    # RUNNER_LABEL only if a self-hosted pool is required.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-minify-plugin

      - name: Build (strict) & deploy to gh-pages
        run: |
          mkdocs build --strict
          mkdocs gh-deploy --force --no-history

